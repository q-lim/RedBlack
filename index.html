<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Question Flip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 class="sr-only">Question Flip</h1>

    <button id="get-question" type="button" disabled>Get a question!</button>

    <!-- The card holds two faces. Each tap writes into the hidden one, then flips. -->
    <div class="scene" aria-live="polite">
      <div class="card" id="card">
        <div class="face" id="face-front"></div>
        <div class="face back" id="face-back"></div>
      </div>
    </div>

    <p id="message" role="status"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
